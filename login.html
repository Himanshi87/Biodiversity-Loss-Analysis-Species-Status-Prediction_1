<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | BioRisk</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="authbody">
<div class="authwrap">
  <div class="brand big">🌿 BioRisk</div>
  <p class="note">Species extinction-risk predictor</p>
  <div class="card">
    <h2 class="authtitle">Log in</h2>
    <div id="msg" class="msg" role="alert"></div>
    <form id="f-login">
      <label for="l-email">Email</label><input id="l-email" type="email" required autocomplete="email">
      <label for="l-pass">Password</label><input id="l-pass" type="password" required autocomplete="current-password">
      <button type="submit">Log in</button>
    </form>
    <p class="switch">New here? <a href="/signup">Create an account</a></p>
  </div>
</div>
<script src="auth.js"></script>
</body>
</html>
