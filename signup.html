<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up | BioRisk</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="authbody">
<div class="authwrap">
  <div class="brand big">🌿 BioRisk</div>
  <p class="note">Species extinction-risk predictor</p>
  <div class="card">
    <h2 class="authtitle">Create your account</h2>
    <div id="msg" class="msg" role="alert"></div>
    <form id="f-reg">
      <label for="r-name">Full name</label><input id="r-name" required maxlength="80" autocomplete="name">
      <label for="r-email">Email</label><input id="r-email" type="email" required autocomplete="email">
      <label for="r-pass">Password (min 8 characters)</label><input id="r-pass" type="password" required minlength="8" autocomplete="new-password">
      <button type="submit">Sign up</button>
    </form>
    <p class="switch">Already have an account? <a href="/login">Log in</a></p>
  </div>
</div>
<script src="auth.js"></script>
</body>
</html>
